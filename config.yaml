# =====================================================================
# MyGate AI — configuration
# Anything that may change between model versions (v1, v2, ...) lives here only.
# =====================================================================

model_version: "v1"

# ---- Data sources ---------------------------------------------------
# To add a dataset: add a source here + a column map for it in mygate_ai/schema.py
sources:
  cic2017:
    kaggle_id: "chethuhn/network-intrusion-dataset"
    path: "../archive"    # read from this folder if it exists, otherwise (Colab) download with kagglehub
    enabled: true
  # cic2018:            # v2 — more brute_force samples
  #   kaggle_id: "solarmainframe/ids-intrusion-csv"
  #   enabled: false
  # lab:                # v2 — MyGate lab traffic (cicflowmeter)
  #   path: "data/lab/"
  #   enabled: false

# ---- Label map ------------------------------------------------------
# original dataset label  ->  our class (the contract with the team)
# Any label not listed here is dropped from training (Web Attacks, Bot, ...)
classes: [benign, portscan, brute_force, dos]

label_map:
  # --- CIC-IDS2017 ---
  BENIGN: benign
  PortScan: portscan
  FTP-Patator: brute_force
  SSH-Patator: brute_force
  DDoS: dos
  DoS Hulk: dos
  DoS GoldenEye: dos
  DoS slowloris: dos
  DoS Slowhttptest: dos
  # --- CIC-IDS2018 (v2) — different names ---
  # Benign: benign
  # FTP-BruteForce: brute_force
  # SSH-Bruteforce: brute_force
  # DDoS attacks-LOIC-HTTP: dos
  # DoS attacks-Hulk: dos

# ---- Features -------------------------------------------------------
# Canonical names, as defined in mygate_ai/schema.py
# "all" = every feature shared by training and live
features: all
drop_features:
  - fwd_header_len_dup      # duplicate column in CIC-IDS2017 (Fwd Header Length.1)
  # The 8 constant (zero-variance) columns that Cell 17 found in CIC-IDS2017:
  - bwd_psh_flags
  - bwd_urg_flags
  - fwd_byts_b_avg
  - fwd_pkts_b_avg
  - fwd_blk_rate_avg
  - bwd_byts_b_avg
  - bwd_pkts_b_avg
  - bwd_blk_rate_avg
  # - dst_port              # item 12: try without it
  # - init_fwd_win_byts     # item 12
  # - init_bwd_win_byts     # item 12

# ---- Training -------------------------------------------------------
random_state: 42
test_size: 0.3

model:
  type: random_forest       # random_forest | xgboost
  params:
    n_estimators: 100
    max_depth: 20
    min_samples_leaf: 10
    n_jobs: -1

# ---- Paths ----------------------------------------------------------
paths:
  cache: "data/clean.parquet"     # data after cleaning (item 7 of the base plan)
  # Inside the package so load() finds the model without a path,
  # and the wheel picks it up as package data
  models_dir: "mygate_ai/models"
