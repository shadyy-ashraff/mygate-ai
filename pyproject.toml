# Builds the mygate_ai wheel — this is what gets delivered to the backend.
#   .venv\Scripts\python -m build --wheel
#   pip install dist\mygate_ai-1.0.0-py3-none-any.whl
# The model itself ships inside the wheel as package data, so load() needs no path.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mygate-ai"
version = "1.0.0"
description = "MyGate — classify network flows (CICFlowMeter) as benign/portscan/brute_force/dos"
readme = "INTEGRATION.md"
# Matches python_version in mygate_ai/models/v1/schema.json (3.12.10).
# Deliberately narrow: model.pkl is a pickle, so the same reasoning that pins
# library versions also applies to the Python version itself.
requires-python = ">=3.12,<3.13"

# These versions are **pinned exactly** as in mygate_ai/models/v1/schema.json.
# model.pkl is a pickle: a different version may unpickle it and silently give
# different results, which is why load(strict=True) refuses to run.
dependencies = [
    "scikit-learn==1.6.1",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "joblib==1.6.0",
]

[tool.setuptools]
# mygate_ai only — the training code in src/ is not shipped
packages = ["mygate_ai"]

[tool.setuptools.package-data]
# Only the shipped model version, not every folder in mygate_ai/models/.
# Must match DEFAULT_MODEL_VERSION in mygate_ai/inference.py.
mygate_ai = ["models/v1/*"]
